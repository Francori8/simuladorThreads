<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulador de Threads</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <div class="header-bar">
        <div class="header-izq">
          <button id="btn-toggle-ejemplos" class="btn-toggle-ejemplos" aria-expanded="true" title="Mostrar/ocultar ejemplos">☰</button>
          <h1>Simulador de Threads</h1>
        </div>
        <div class="header-controles">
          <span class="config-label">Probabilidad</span>
          <input type="range" name="porcentaje" id="porcentaje" min="0" max="6" value="0" />
          <span class="config-label">Límite</span>
          <div class="limite-ciclos-opciones">
            <input type="radio" name="limite" id="limite-5" value="5" />
            <label for="limite-5">5</label>
            <input type="radio" name="limite" id="limite-10" value="10" checked />
            <label for="limite-10">10</label>
            <input type="radio" name="limite" id="limite-20" value="20" />
            <label for="limite-20">20</label>
            <input type="radio" name="limite" id="limite-SinLimite" value="-1" />
            <label for="limite-SinLimite">∞</label>
          </div>
        </div>
      </div>
    </header>

    <main>
      <aside id="panel-ejemplos">
        <div id="contenedorBotones"></div>
      </aside>

      <section id="contenedorDeTexto">
        <textarea name="codigo" id="codigo">global Int n = 0

Thread(2){

       while( n == 1){
         n = n + 1
       }

}</textarea>
        <div class="editor-footer">
          <div id="panel-error" hidden></div>
          <button id="ejecutar">Ejecutar</button>
          <button id="cancelar" hidden>Cancelar</button>
          <button id="btn-pasoapaso">Paso a paso</button>
        </div>
      </section>

      <section id="visual">
        <div id="panel-traza">
          <div id="panel-salida">
            <div class="seccionEscrita">
              <h2 class="subtitulo">Variables globales</h2>
              <p id="variables"></p>
            </div>
            <div class="seccionEscrita">
              <h2 class="subtitulo">Consola</h2>
              <div id="consola"></div>
            </div>
          </div>
          <div class="subtitulo-fila">
            <h2 class="subtitulo">Traza de Ejecución</h2>
            <button id="btn-copiar-traza" hidden>Copiar</button>
          </div>
          <div id="traza"></div>
        </div>

      </section>
    </main>

    <!-- Panel modo paso a paso — ocupa todo el main cuando está activo -->
    <div id="panel-pasoapaso" hidden>
      <div id="pap-cuerpo">
        <div id="pap-izq">
          <h2 class="subtitulo">Threads</h2>
          <div id="pap-threads"></div>
          <h2 class="subtitulo pap-sec">Variables globales</h2>
          <div id="pap-variables"></div>
          <h2 class="subtitulo pap-sec">Consola</h2>
          <div id="pap-consola"></div>
        </div>
        <div id="pap-derecha">
          <h2 class="subtitulo">Traza</h2>
          <div id="pap-traza"></div>
        </div>
      </div>
      <div id="pap-controles">
        <button id="pap-auto">▶ Auto</button>
        <button id="pap-manual">Manual</button>
        <button id="pap-pausa" disabled>⏸ Pausar</button>
        <button id="pap-siguiente">→ Siguiente</button>
        <button id="pap-reiniciar">↺ Reiniciar</button>
        <button id="pap-cancelar">✕ Cancelar</button>
        <label class="pap-velocidad-label">
          Vel.
          <input type="range" id="pap-velocidad" min="0" max="6" value="3" disabled />
        </label>
        <span id="pap-contador">Paso 0</span>
      </div>
    </div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
